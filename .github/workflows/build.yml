name: Build

on: [push]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=kurumimnmod\\:field_world\nlevel-seed=12345\nonline-mode=false\nenable-rcon=true\nrcon.password=probe\nrcon.port=25575\npause-when-empty-seconds=0\n' > run/server.properties
          cat run/server.properties
      - name: Run server (stop after start)
        run: |
          ./gradlew runServer > server_out.txt 2>&1 &
          for i in $(seq 1 120); do
            sleep 5
            if grep -q "Done (" server_out.txt; then echo "STARTED"; break; fi
            if grep -qE "BUILD FAILED|Exception in server tick loop|Failed to start the minecraft server" server_out.txt; then echo "FAILED"; break; fi
          done
          sleep 5
          python3 .github/rcon_probe.py load || true
          sleep 60
          python3 .github/rcon_probe.py push || true
          # 強制読み込みしたチャンクの生成を待つ
          for i in $(seq 1 60); do sleep 10; tail -c 300 server_out.txt | tr -d '\r' | tail -1; done
          python3 .github/rcon_probe.py save || true
          sleep 10
          pkill -f runServer || true; pkill -f java || true
          grep -nE "ERROR|Exception|Caused by|kurumimnmod|Done \(|Preparing spawn|level-type" server_out.txt | grep -v "DEBUG" | head -150
          echo ----; grep -n "level.dat\|Preparing level\|地形v2" server_out.txt | head -20
          for f in $(find . -name "*_preview.png" -path "*terrain*"); do echo "PNG_bake $(base64 -w0 $f)"; done
      - name: Analyze terrain
        if: always()
        run: |
          pip install nbtlib numpy matplotlib >/dev/null
          python3 .github/analyze.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-result
          path: probe_out
