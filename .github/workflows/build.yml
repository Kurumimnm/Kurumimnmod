name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava
      - name: probe
        run: |
          MC=$(find build ~/.gradle -name "minecraft-patched-26.3*.jar" 2>/dev/null | grep -v sources | head -1)
          UNI=$(find ~/.gradle -name "neoforge-26.3*-universal.jar" | head -1)
          CLIENT=$(find ~/.gradle -name "client-extra*.jar" -o -name "minecraft-client*.jar" 2>/dev/null | head -1)
          echo "MC=$MC UNI=$UNI"
          for c in $(unzip -Z1 "$MC" | grep -E "entity/monster/.*(Spider|Creeper|EnderMan|Zombie|Skeleton)\.class$|world/clock/WorldClock\.class$" ); do echo "CLS $c"; done
          javap -cp "$MC" -p net.minecraft.world.entity.Mob | grep -iE "goalSelector|targetSelector"
          javap -cp "$MC" -p net.minecraft.core.registries.Registries | grep -iE "clock|timeline"
          javap -cp "$MC" -p net.minecraft.world.level.gamerules.GameRules | grep -iE "public .*(set|get)\("
          unzip -Z1 "$UNI" | grep -iE "MobGriefing|EntityTeleportEvent|ExplosionEvent|EntityJoinLevel" 
          javap -cp "$UNI:$MC" -p 'net.neoforged.neoforge.event.entity.EntityMobGriefingEvent' 2>&1 | head -20
          javap -cp "$UNI:$MC" -p 'net.neoforged.neoforge.event.entity.EntityTeleportEvent$EnderEntity' 2>&1 | head -20
          javap -cp "$UNI:$MC" -p 'net.neoforged.neoforge.event.entity.EntityTeleportEvent' 2>&1 | head -30
          javap -cp "$UNI:$MC" -p 'net.neoforged.neoforge.event.level.ExplosionEvent$Detonate' 2>&1 | head -20
          unzip -p "$UNI" META-INF/accesstransformer.cfg 2>/dev/null | grep -iE "goalSelector|targetSelector|net.minecraft.world.entity.Mob " | head
          find ~/.gradle -name "accesstransformer*.cfg" | head -3 | xargs -r grep -hiE "goalSelector|targetSelector" | head
