name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew compileJava || true
      - name: Dump culling API
        run: |
          JARS=$(find ~/.gradle build -name "*.jar" 2>/dev/null | grep -i -E "minecraft|neoforge" | grep -v -i sources)
          echo "$JARS" | head -20
          for J in $JARS; do
            if unzip -l "$J" 2>/dev/null | grep -q "net/minecraft/client/renderer/entity/EntityRenderer.class"; then
              echo "== $J"
              javap -p -cp "$J" net.minecraft.client.renderer.entity.EntityRenderer | grep -i -E "cull|shouldRender|BoundingBox"
              javap -p -cp "$J" net.minecraft.world.entity.Entity | grep -i -E "cull|shouldRender|BoundingBoxFor"
              javap -p -cp "$J" net.minecraft.client.renderer.rendertype.RenderTypes | grep -i translucent
              break
            fi
          done
