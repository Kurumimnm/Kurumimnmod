name: Build

on: [push]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=kurumimnmod\\:field_world\nlevel-seed=12345\nonline-mode=false\nenable-rcon=true\nrcon.password=probe\nrcon.port=25575\n' > run/server.properties
          cat run/server.properties
      - name: Run server (stop after start)
        run: |
          ./gradlew runServer > server_out.txt 2>&1 &
          for i in $(seq 1 120); do
            sleep 5
            if grep -q "Done (" server_out.txt; then echo "STARTED"; break; fi
            if grep -qE "BUILD FAILED|Exception in server tick loop|Failed to start the minecraft server" server_out.txt; then echo "FAILED"; break; fi
          done
          sleep 5
          python3 .github/rcon_probe.py || true
          sleep 3
          pkill -f runServer || true; pkill -f java || true
          grep -nE "ERROR|Exception|Caused by|kurumimnmod|Done \(|Preparing spawn|level-type" server_out.txt | grep -v "DEBUG" | head -150
          echo ----; grep -n "level.dat\|Preparing level" server_out.txt | head
      - name: Inspect level
        if: always()
        run: ls -la run run/world 2>/dev/null | head -30
