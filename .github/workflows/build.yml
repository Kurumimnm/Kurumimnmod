name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nenable-rcon=true\nrcon.password=probe\nrcon.port=25575\npause-when-empty-seconds=0\nview-distance=4\n' > run/server.properties
      - name: Run server and watch Astra Veil fly
        run: |
          ./gradlew runServer > server_out.txt 2>&1 &
          for i in $(seq 1 120); do
            sleep 5
            if grep -q "Done (" server_out.txt; then echo "STARTED"; break; fi
            if grep -qE "BUILD FAILED|Exception in server tick loop|Failed to start the minecraft server" server_out.txt; then echo "FAILED"; break; fi
          done
          sleep 5
          python3 .github/rcon_probe.py || true
          pkill -f runServer || true; pkill -f java || true
          echo "---- server log (errors) ----"
          grep -nE "ERROR|Exception|Caused by|Can't keep up|astra|Done \(" server_out.txt | grep -v "DEBUG" | head -80
