name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava
      - name: probe
        run: |
          MC=$(find build ~/.gradle -name "minecraft-patched-26.3*.jar" 2>/dev/null | head -1); UNI=$(find ~/.gradle -name "neoforge-26.3*-universal.jar" | head -1)
          GL=$(find ~/.gradle -name "geckolib-neoforge*.jar" | grep -v sources | head -1)
          CP="$MC:$GL:$UNI"
          echo "######## GeoEntityRenderer -c"
          javap -c -p -cp "$CP" com.geckolib.renderer.GeoEntityRenderer | grep -A60 -E "(createRenderState|extractRenderState|submit|addRenderData)\(" | head -400
          echo "######## GeoRenderer -c"
          javap -c -p -cp "$CP" com.geckolib.renderer.base.GeoRenderer | grep -A40 -E "addRenderData|performRenderPass\(R" | head -200
          for c in com.geckolib.renderer.base.GeoRenderState com.geckolib.constant.dataticket.DataTicket net.minecraft.world.entity.projectile.ProjectileUtil net.neoforged.neoforge.client.renderstate.BaseRenderState; do echo "######## $c"; javap -cp "$CP" $c; done
          echo "######## EntityRenderer createRenderState -c"
          javap -c -p -cp "$CP" net.minecraft.client.renderer.entity.EntityRenderer | grep -A40 "createRenderState(T, float)" | head -60
