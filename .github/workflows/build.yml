name: Probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install virtual display
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb imagemagick mesa-utils libgl1-mesa-dri mesa-vulkan-drivers > /dev/null
      - name: Prepare server and client
        run: |
          mkdir -p run run-client
          echo "eula=true" > run/eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nenable-rcon=true\nrcon.password=probe\nrcon.port=25575\npause-when-empty-seconds=0\nview-distance=16\nsimulation-distance=8\nspawn-protection=0\n' > run/server.properties
          printf 'renderDistance:16\nsimulationDistance:8\nonboardAccessibility:false\nskipMultiplayerWarning:true\ntutorialStep:none\njoinedFirstServer:true\nsoundCategory_master:0.0\npauseOnLostFocus:false\nfov:0.25\nhideServerAddress:true\n' > run-client/options.txt
          ./gradlew compileJava -q
      - name: Run server, client and take screenshots
        run: |
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          sleep 3
          export LIBGL_ALWAYS_SOFTWARE=1
          glxinfo -B | head -20 || true
          ./gradlew runServer > server_out.txt 2>&1 &
          for i in $(seq 1 120); do sleep 5; if grep -q "Done (" server_out.txt; then echo "SERVER STARTED"; break; fi; done
          ./gradlew runClient > client_out.txt 2>&1 &
          sleep 30
          timeout 1500 python3 .github/render_probe.py || true
          import -window root shots/99_last.png || true
          pkill -f runClient || true; pkill -f runServer || true; sleep 3; pkill -f java || true
          echo "---- server log ----"; grep -nE "ERROR|Exception|Caused by|astra|Done \(|joined" server_out.txt | head -60
          echo "---- client log ----"; grep -nE "ERROR|Exception|Caused by|astra|Backend|Connecting|quickPlay|Quick" client_out.txt | head -60
          echo "---- client log tail ----"; tail -120 client_out.txt | cut -c1-400
          mkdir -p shots; cp client_out.txt server_out.txt shots/ || true
      - name: Push screenshots to a branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp shots/*.png /tmp/shots/ 2>/dev/null || true
          tail -400 client_out.txt > /tmp/shots/client_tail.txt 2>/dev/null || true
          cd /tmp/shots && git init -q && git checkout -q -b probe/astra-veil-shots
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -q -m "probe: screenshots ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" probe/astra-veil-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
