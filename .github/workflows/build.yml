name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava
      - name: probe
        run: |
          MC=$(find build ~/.gradle -name "minecraft-patched-26.3*.jar" 2>/dev/null | grep -v sources | head -1)
          UNI=$(find ~/.gradle -name "neoforge-26.3*-universal.jar" | head -1)
          echo "################ API"
          javap -cp "$MC" -p net.minecraft.world.entity.Entity | grep -iE "tag|RemovalReason" || true
          javap -cp "$MC" -p 'net.minecraft.world.entity.Entity$RemovalReason' | head -20 || true
          javap -cp "$MC" -p net.minecraft.world.item.component.ItemLore | grep -E "public|record" || true
          javap -cp "$MC" -p net.minecraft.world.item.component.CustomData | grep -E "public" || true
          javap -cp "$MC" -p net.minecraft.core.component.DataComponents | grep -iE "UNBREAKABLE|LORE|CUSTOM_DATA" || true
          javap -cp "$MC" -p net.minecraft.world.item.Items | grep -iE "SPEAR|WOODEN_AXE|WOODEN_SWORD" || true
          javap -cp "$UNI:$MC" -p net.neoforged.neoforge.event.entity.living.LivingDropsEvent | head -20 || true
          javap -cp "$MC" -p net.minecraft.world.entity.player.Player | grep -iE " addItem| drop\(" || true
          javap -cp "$MC" -p net.minecraft.world.item.ItemStack | grep -iE "isDamageableItem|getHoverName" || true
          javap -cp "$MC" -p net.minecraft.world.entity.player.Inventory | grep -iE "getContainerSize|setItem|getItem\(" || true
