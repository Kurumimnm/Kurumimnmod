name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      # データ生成を実行し、src/generated の内容がコミット済みのものと一致するか確認する
      # （runData の実行し忘れ・生成ファイルのコミット忘れを検出）
      - name: Run data generation
        run: ./gradlew runData

      - name: Check generated resources are up to date
        run: |
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated is out of date. Run ./gradlew runData and commit the result."
            git status --porcelain -- src/generated
            git diff -- src/generated
            git ls-files --others --exclude-standard -- src/generated | while read -r f; do echo "===== $f"; cat "$f"; done
            exit 1
          fi
