name: Probe
on: [push]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileJava
      - name: probe
        run: |
          MC=$(find build ~/.gradle -name "minecraft-patched-26.3*.jar" 2>/dev/null | grep -v sources | head -1)
          UNI=$(find ~/.gradle -name "neoforge-26.3*-universal.jar" | head -1)
          GL=$(find ~/.gradle -name "geckolib-neoforge*.jar" | grep -v sources | head -1)
          echo "MC=$MC GL=$GL UNI=$UNI"
          curl -sSL -o vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir -p cls/mc cls/gl cls/neo out
          pick() { # jar dir regex
            unzip -Z1 "$1" | grep -E "$3" | while read -r f; do unzip -o -q "$1" "$f" -d "$2"; done
          }
          pick "$MC" cls/mc '/(LivingEntity|ItemModelGenerators|GameRules)\.class$'
          pick "$MC" cls/mc 'renderer/entity/state/(LivingEntityRenderState|EntityRenderState)\.class$'
          pick "$MC" cls/mc 'world/item/Item\$Properties\.class$'
          pick "$GL" cls/gl 'com/geckolib/animation/state/BoneSnapshot\.class$'
          pick "$UNI" cls/neo 'neoforge/registries/(GameData|NeoForgeRegistriesSetup|RegistryManager)\.class$'
          find cls -name '*.class' | sed 's/^/CLASS /'
          java -jar vf.jar -dgs=1 -ind="    " cls out > /dev/null 2>&1 || true
          find out -name '*.java' | sort | while read -r f; do echo "################ $f"; cat "$f"; done
          echo "################ GREP"
          javap -cp "$UNI:$MC" -p net.neoforged.neoforge.event.entity.living.LivingDamageEvent\$Pre
