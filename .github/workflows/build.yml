name: Build

on: [push]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'level-seed=12345\nonline-mode=false\nenable-rcon=true\nrcon.password=probe\nrcon.port=25575\npause-when-empty-seconds=0\n' > run/server.properties
      - name: Run server
        run: |
          ./gradlew runServer > server_out.txt 2>&1 &
          for i in $(seq 1 120); do
            sleep 5
            if grep -q "Done (" server_out.txt; then echo "STARTED"; break; fi
            if grep -qE "BUILD FAILED|Exception in server tick loop|Failed to start the minecraft server" server_out.txt; then echo "FAILED"; break; fi
          done
          sleep 5
          python3 .github/rcon_probe.py || true
          sleep 5
          pkill -f runServer || true; pkill -f java || true
          echo "======== LOG"
          grep -nE "ERROR|WARN.*(kurumimnmod|griffin|Griffin)|Exception|Caused by|at io.github|Done \(" server_out.txt | grep -v DEBUG | head -80
